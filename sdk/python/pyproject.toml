[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hubvery-sdk"
version = "0.1.0"
description = "Official Python SDK for the HUBVERY Fleet API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "respx>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/hubvery_sdk"]
